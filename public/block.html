<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Denied</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0b;
        --text: #e8e8ea;
        --muted: #6b6b70;
        --accent: #8a8a92;
      }

      * { box-sizing: border-box; }

      html, body {
        height: 100%;
        margin: 0;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .content {
        max-width: 320px;
        text-align: center;
      }

      .icon {
        width: 28px;
        height: 28px;
        margin: 0 auto 20px;
        color: var(--muted);
      }

      .icon svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      h1 {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0 0 8px;
        color: var(--text);
      }

      p {
        font-size: 13.5px;
        line-height: 1.55;
        color: var(--muted);
        margin: 0;
      }

      @media (max-width: 380px) {
        h1 { font-size: 16px; }
        p { font-size: 13px; }
      }

      @media (prefers-reduced-motion: no-preference) {
        .content {
          animation: fade 0.4s ease-out;
        }
      }

      @keyframes fade {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="5" y="11" width="14" height="9" rx="1.5"/>
          <path d="M8 11V7.5a4 4 0 0 1 8 0V11"/>
        </svg>
      </div>
      <h1>Access denied</h1>
      <p>This link only works when run from inside Roblox.</p>
    </div>
  </body>
</html>
