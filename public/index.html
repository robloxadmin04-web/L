<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L - Sign In</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --bg-primary: #0a0a0a;
        --bg-secondary: #141414;
        --bg-card: #1a1a1a;
        --border: #2a2a2a;
        --border-hover: #3a3a3a;
        --text-primary: #ffffff;
        --text-secondary: #a0a0a0;
        --text-muted: #6a6a6a;
        --accent: #ffffff;
        --input-bg: #0f0f0f;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
        background-size: 40px 40px;
      }

      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 100vh;
      }

      /* LEFT SIDE */
      .left-panel {
        padding: 40px 60px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        position: relative;
      }

      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo svg {
        width: 36px;
        height: 36px;
      }

      .brand-name {
        font-size: 14px;
        letter-spacing: 3px;
        color: var(--text-secondary);
        font-weight: 600;
      }

      .hero {
        max-width: 500px;
      }

      .hero-label {
        font-size: 12px;
        letter-spacing: 3px;
        color: var(--text-secondary);
        margin-bottom: 20px;
      }

      .hero h1 {
        font-size: 56px;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 20px;
        color: var(--text-primary);
      }

      .hero p {
        font-size: 15px;
        color: var(--text-secondary);
      }

      .big-logo {
        display: flex;
        justify-content: flex-start;
        padding: 20px 0;
      }

      .big-logo svg {
        width: 200px;
        height: 200px;
      }

      /* RIGHT SIDE */
      .right-panel {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px;
        position: relative;
      }

      .theme-toggle {
        position: absolute;
        top: 30px;
        right: 30px;
        width: 40px;
        height: 40px;
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: border-color 0.2s;
      }

      .theme-toggle:hover {
        border-color: var(--border-hover);
      }

      .theme-toggle svg {
        width: 18px;
        height: 18px;
        color: var(--text-primary);
      }

      .login-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 400px;
      }

      .card-label {
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--text-secondary);
        margin-bottom: 12px;
      }

      .card-title {
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .card-subtitle {
        font-size: 14px;
        color: var(--text-secondary);
        margin-bottom: 24px;
      }

      .google-btn {
        width: 100%;
        padding: 12px;
        background-color: var(--bg-secondary);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition:
          border-color 0.2s,
          background-color 0.2s;
      }

      .google-btn:hover {
        border-color: var(--border-hover);
        background-color: #1f1f1f;
      }

      .google-btn svg {
        width: 18px;
        height: 18px;
      }

      .divider {
        display: flex;
        align-items: center;
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        margin: 20px 0;
      }

      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        border-bottom: 1px solid var(--border);
      }

      .divider::before {
        margin-right: 12px;
      }

      .divider::after {
        margin-left: 12px;
      }

      .form-group {
        margin-bottom: 16px;
      }

      .form-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        letter-spacing: 2px;
        color: var(--text-secondary);
        margin-bottom: 8px;
      }

      .forgot-link {
        color: var(--text-primary);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0;
        text-transform: none;
        font-weight: 600;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      .input-wrapper {
        position: relative;
      }

      .form-input {
        width: 100%;
        padding: 12px 14px;
        background-color: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-primary);
        font-size: 14px;
        transition: border-color 0.2s;
      }

      .form-input:focus {
        outline: none;
        border-color: var(--text-secondary);
      }

      .form-input::placeholder {
        color: var(--text-muted);
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4px;
      }

      .password-toggle:hover {
        color: var(--text-primary);
      }

      .password-toggle svg {
        width: 18px;
        height: 18px;
      }

      .remember-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px;
        background-color: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 20px;
        cursor: pointer;
      }

      .remember-text {
        display: flex;
        flex-direction: column;
      }

      .remember-title {
        font-size: 14px;
        font-weight: 600;
        color: var(--text-primary);
      }

      .remember-desc {
        font-size: 12px;
        color: var(--text-secondary);
        margin-top: 2px;
      }

      .checkbox {
        width: 18px;
        height: 18px;
        accent-color: var(--text-primary);
        cursor: pointer;
      }

      .signin-btn {
        width: 100%;
        padding: 13px;
        background-color: var(--text-primary);
        color: var(--bg-primary);
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .signin-btn:hover {
        background-color: #e0e0e0;
      }

      .signup-text {
        text-align: center;
        margin-top: 20px;
        font-size: 13px;
        color: var(--text-secondary);
      }

      .signup-link {
        color: var(--text-primary);
        text-decoration: none;
        font-weight: 600;
      }

      .signup-link:hover {
        text-decoration: underline;
      }

      /* RESPONSIVE */
      @media (max-width: 900px) {
        .container {
          grid-template-columns: 1fr;
        }

        .left-panel {
          padding: 30px;
        }

        .hero h1 {
          font-size: 40px;
        }

        .big-logo svg {
          width: 140px;
          height: 140px;
        }

        .right-panel {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- LEFT PANEL -->
      <div class="left-panel">
        <div class="top-bar">
          <div class="logo">
            <svg
              viewBox="0 0 64 64"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="8"
                y="8"
                width="48"
                height="48"
                rx="10"
                fill="#1a1a1a"
                stroke="#ffffff"
                stroke-width="2"
              />
              <path
                d="M22 18 L22 46 L44 46 L44 40 L28 40 L28 18 Z"
                fill="#ffffff"
              />
            </svg>
            <span class="brand-name">L</span>
          </div>
        </div>

        <div class="hero">
          <div class="hero-label">L</div>
          <h1>Your scripts.<br />One loader.</h1>
          <p>Projects, keys, Discord, reward links.</p>
        </div>

        <div class="big-logo">
          <svg
            viewBox="0 0 200 200"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect
              x="10"
              y="10"
              width="180"
              height="180"
              rx="24"
              fill="none"
              stroke="#2a2a2a"
              stroke-width="2"
            />
            <path
              d="M55 40 L55 160 L155 160 L155 140 L80 140 L80 40 Z"
              fill="#ffffff"
            />
          </svg>
        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>

        <div class="login-card">
          <div class="card-label">SIGN IN</div>
          <h2 class="card-title">Welcome back</h2>
          <p class="card-subtitle">Access your dashboard</p>

          <button class="google-btn" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Continue with Google
          </button>

          <div class="divider">OR</div>

          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="email">EMAIL</label>
              <div class="input-wrapper">
                <input
                  class="form-input"
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="password">
                PASSWORD
                <a href="#" class="forgot-link">Forgot password?</a>
              </label>
              <div class="input-wrapper">
                <input
                  class="form-input"
                  type="password"
                  id="password"
                  placeholder="Password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                  id="togglePassword"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <label class="remember-box">
              <div class="remember-text">
                <span class="remember-title">Remember me</span>
                <span class="remember-desc"
                  >Keep this session active for 7 days.</span
                >
              </div>
              <input type="checkbox" class="checkbox" />
            </label>

            <button type="submit" class="signin-btn">Sign in</button>
          </form>

          <p class="signup-text">
            Don't have an account? <a href="#" class="signup-link">Sign up</a>
          </p>
        </div>
      </div>
    </div>

    <script>
      // Toggle password visibility
      const toggleBtn = document.getElementById("togglePassword");
      const passwordInput = document.getElementById("password");

      toggleBtn.addEventListener("click", function () {
        const isPassword = passwordInput.type === "password";
        passwordInput.type = isPassword ? "text" : "password";
      });

      // Form submit handler
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;
          console.log("Sign in attempt:", { email });
        });
    </script>
  </body>
</html>
