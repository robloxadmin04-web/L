<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access</title>
    <link rel="stylesheet" href="../style/style-api-gate-v2.css" />
  </head>
  <body>
    <main class="layout">
      <section class="intro" aria-label="Introduction">
        <div class="intro-inner">
          <p class="eyebrow">Secure Access</p>
          <h1 class="intro-title">
            Private platform access for approved users.
          </h1>
          <p class="intro-copy">
            Enter your assigned API key to continue to the dashboard.
          </p>
        </div>
      </section>
      <section class="panel" aria-label="API key access panel">
        <div class="card">
          <p class="card-label">API Key Access</p>
          <h2 class="card-title">Enter your access key</h2>
          <p class="card-subtitle">
            Access is limited to users with an active key.
          </p>
          <form id="accessForm" novalidate>
            <div class="field">
              <label for="apiKey">API Key</label>
              <div class="key-wrap">
                <input
                  id="apiKey"
                  name="apiKey"
                  type="password"
                  placeholder="Enter API key"
                  autocomplete="off"
                  spellcheck="false"
                  required
                />
                <button
                  class="icon-btn"
                  type="button"
                  id="toggleKey"
                  aria-label="Show API key"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M1.5 12s3.8-6.5 10.5-6.5S22.5 12 22.5 12 18.7 18.5 12 18.5 1.5 12 1.5 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <div class="helper-row">
              <p class="helper-text">Use only the key assigned by the owner.</p>
            </div>
            <button class="submit-btn" type="submit">Continue</button>
            <p id="statusMessage" class="status-message" aria-live="polite"></p>
          </form>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
