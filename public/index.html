<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In</title>
    <link rel="stylesheet" href="../style/style.css" />
  </head>
  <body>
    <main class="layout">
      <section class="intro" aria-label="Introduction">
        <div class="intro-inner">
          <p class="eyebrow">Secure Access</p>
          <h1 class="intro-title">Your scripts.<br />One loader.</h1>
          <p class="intro-copy">
            Sign in to continue to your dashboard and account workspace.
          </p>
        </div>
      </section>
      <section class="panel" aria-label="Sign in panel">
        <button class="theme-toggle" type="button" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            ></path>
          </svg>
        </button>
        <div class="card">
          <p class="card-label">Sign In</p>
          <h2 class="card-title">Welcome back</h2>
          <p class="card-subtitle">Access your dashboard</p>
          <button class="google-btn" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="#ffffff"
                d="M21.6 12.23c0-.68-.06-1.34-.18-1.97H12v3.73h5.38a4.61 4.61 0 0 1-2 3.03v2.52h3.24c1.9-1.75 2.98-4.32 2.98-7.31Z"
              ></path>
              <path
                fill="#d1d5db"
                d="M12 22c2.7 0 4.96-.89 6.61-2.41l-3.24-2.52c-.9.61-2.05.98-3.37.98-2.6 0-4.81-1.76-5.6-4.12H3.08v2.58A9.98 9.98 0 0 0 12 22Z"
              ></path>
              <path
                fill="#9ca3af"
                d="M6.4 13.93A5.99 5.99 0 0 1 6.08 12c0-.67.12-1.31.32-1.93V7.49H3.08A9.98 9.98 0 0 0 2 12c0 1.61.38 3.13 1.08 4.51l3.32-2.58Z"
              ></path>
              <path
                fill="#6b7280"
                d="M12 5.95c1.47 0 2.78.51 3.82 1.5l2.87-2.87C16.95 2.96 14.69 2 12 2a9.98 9.98 0 0 0-8.92 5.49L6.4 10.07c.79-2.36 3-4.12 5.6-4.12Z"
              ></path>
            </svg>
            <span>Continue with Google</span>
          </button>
          <div class="divider"><span>OR</span></div>
          <form id="loginForm" novalidate>
            <div class="field">
              <label for="email">Email</label>
              <input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>
            <div class="field">
              <div class="label-row">
                <label for="password">Password</label>
                <a href="#" class="text-link">Forgot password?</a>
              </div>
              <div class="password-wrap">
                <input
                  id="password"
                  name="password"
                  type="password"
                  placeholder="Password"
                  autocomplete="current-password"
                  required
                />
                <button
                  class="icon-btn"
                  type="button"
                  aria-label="Show password"
                  id="togglePassword"
                >
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M1.5 12s3.8-6.5 10.5-6.5S22.5 12 22.5 12 18.7 18.5 12 18.5 1.5 12 1.5 12Z"
                    ></path>
                    <circle cx="12" cy="12" r="3"></circle>
                  </svg>
                </button>
              </div>
            </div>
            <label class="remember">
              <span class="remember-copy">
                <span class="remember-title">Remember me</span>
                <span class="remember-text"
                  >Keep this session active for 7 days.</span
                >
              </span>
              <input type="checkbox" name="remember" />
            </label>
            <button class="submit-btn" type="submit">Sign in</button>
          </form>
          <p class="footer-copy">
            Do not have an account? <a href="#" class="text-link">Sign up</a>
          </p>
        </div>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
