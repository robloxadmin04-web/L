<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>L - Sign In</title>
    <link rel="stylesheet" href="../style/style.css" />
  </head>
  <body>
    <div class="container">
      <!-- LEFT PANEL -->
      <div class="left-panel">
        <div class="top-bar">
          <div class="brand-wrap">
            <span class="brand-name">L</span>
          </div>
        </div>

        <div class="hero">
          <div class="hero-label">L</div>
          <h1>Your scripts.<br />One loader.</h1>
          <p>Projects, keys, Discord, reward links.</p>
        </div>

        <div class="hero-spacer"></div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="right-panel">
        <button class="theme-toggle" aria-label="Toggle theme">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
        </button>

        <div class="login-card">
          <div class="card-label">SIGN IN</div>
          <h2 class="card-title">Welcome back</h2>
          <p class="card-subtitle">Access your dashboard</p>

          <button class="google-btn" type="button">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                fill="#4285F4"
              />
              <path
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                fill="#34A853"
              />
              <path
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                fill="#FBBC05"
              />
              <path
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                fill="#EA4335"
              />
            </svg>
            Continue with Google
          </button>

          <div class="divider">OR</div>

          <form id="loginForm">
            <div class="form-group">
              <label class="form-label" for="email">EMAIL</label>
              <div class="input-wrapper">
                <input
                  class="form-input"
                  type="email"
                  id="email"
                  placeholder="you@example.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="password">
                PASSWORD
                <a href="#" class="forgot-link">Forgot password?</a>
              </label>
              <div class="input-wrapper">
                <input
                  class="form-input"
                  type="password"
                  id="password"
                  placeholder="Password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  aria-label="Show password"
                  id="togglePassword"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <label class="remember-box">
              <div class="remember-text">
                <span class="remember-title">Remember me</span>
                <span class="remember-desc"
                  >Keep this session active for 7 days.</span
                >
              </div>
              <input type="checkbox" class="checkbox" />
            </label>

            <button type="submit" class="signin-btn">Sign in</button>
          </form>

          <p class="signup-text">
            Don't have an account? <a href="#" class="signup-link">Sign up</a>
          </p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
